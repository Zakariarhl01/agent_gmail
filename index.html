<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agent Gmail IA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d14;
      --surface:   #13131f;
      --surface2:  #1a1a2e;
      --border:    #252540;
      --accent:    #4f8ef7;
      --accent2:   #7c5cbf;
      --text:      #e2e2f0;
      --muted:     #6b6b8a;
      --success:   #4ade80;
      --warning:   #fb923c;
      --error:     #f87171;
      --urgent:    #ff6b6b;
      --normal:    #67e8f9;
      --agent:     #c084fc;
      --user:      #fde68a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
    }

    /* ── Layout ── */
    .app {
      display: grid;
      grid-template-rows: 56px 1fr;
      grid-template-columns: 220px 1fr;
      height: 100vh;
    }

    /* ── Header ── */
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo { font-size: 20px; }
    .title { font-weight: 600; font-size: 16px; letter-spacing: .3px; }
    .title span { color: var(--accent); }

    .status {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--muted);
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
      transition: all .3s;
    }
    .status-dot.loading { background: var(--warning); box-shadow: 0 0 6px var(--warning); animation: pulse 1s infinite; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Sidebar ── */
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--muted); padding: 4px 8px 8px;
    }

    .action-btn {
      width: 100%;
      padding: 9px 12px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: all .15s;
      display: flex; align-items: center; gap: 8px;
    }
    .action-btn:hover {
      background: var(--surface2);
      border-color: var(--border);
    }
    .action-btn:active { transform: scale(.98); }

    .divider { height: 1px; background: var(--border); margin: 6px 0; }

    .clear-btn {
      margin-top: auto;
      padding: 9px 12px;
      background: transparent;
      border: 1px solid #3a1f1f;
      border-radius: 8px;
      color: var(--error);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
      display: flex; align-items: center; gap: 8px;
    }
    .clear-btn:hover { background: #1f0f0f; }

    /* ── Main ── */
    main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Log area ── */
    #logs {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    #logs::-webkit-scrollbar { width: 6px; }
    #logs::-webkit-scrollbar-track { background: transparent; }
    #logs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .log-line {
      padding: 3px 0;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:translateY(0)} }

    .log-line.info    { color: #93c5fd; }
    .log-line.success { color: var(--success); }
    .log-line.error   { color: var(--error); }
    .log-line.warning { color: var(--warning); }
    .log-line.agent   { color: var(--agent); }
    .log-line.urgent  { color: var(--urgent); }
    .log-line.normal  { color: var(--normal); }
    .log-line.user    { color: var(--user); font-weight: 500; }
    .log-line.muted   { color: var(--muted); }

    /* ── Input bar ── */
    .input-bar {
      padding: 12px 24px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #msg-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color .2s;
    }
    #msg-input:focus { border-color: var(--accent); }
    #msg-input::placeholder { color: var(--muted); }

    #send-btn {
      padding: 11px 20px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    #send-btn:hover { background: #6ba3ff; }
    #send-btn:disabled { background: var(--muted); cursor: not-allowed; }
    #send-btn:active { transform: scale(.97); }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .thinking {
      display: flex; align-items: center;
      color: var(--muted); font-family: 'DM Mono', monospace; font-size: 13px;
      padding: 4px 0;
    }
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header>
    <div class="header-left">
      <span class="logo">✉️</span>
      <span class="title">Agent <span>Gmail</span> IA</span>
    </div>
    <div class="status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Connecté</span>
    </div>
  </header>

  <!-- Sidebar -->
  <aside>
    <div class="sidebar-title">Actions rapides</div>

    <button class="action-btn" onclick="send('lis mes 5 derniers emails')">📥 Lire 5 derniers</button>
    <button class="action-btn" onclick="send('lis mes 10 derniers emails')">📋 Lire 10 derniers</button>

    <div class="divider"></div>

    <button class="action-btn" onclick="send('trie mes mails de cette semaine')">🗂 Trier cette semaine</button>
    <button class="action-btn" onclick="send('trie mes mails de ce mois')">🗂 Trier ce mois</button>
    <button class="action-btn" onclick="send('trie mes 20 derniers mails')">🗂 Trier 20 derniers</button>

    <div class="divider"></div>

    <button class="action-btn" onclick="send('quels sont mes emails urgents ?')">🔴 Emails urgents</button>
    <button class="action-btn" onclick="send('résume mes emails non lus')">📝 Résumer non lus</button>

    <button class="clear-btn" onclick="clearLogs()">🗑 Vider les logs</button>
  </aside>

  <!-- Main -->
  <main>
    <div id="logs">
      <div class="log-line success">🤖 Agent Gmail prêt !</div>
      <div class="log-line info">💡 Utilise les boutons ou écris ta demande en bas.</div>
      <div class="log-line muted">─────────────────────────────────</div>
    </div>

    <div class="input-bar">
      <input id="msg-input" type="text"
        placeholder="Ex: lis mes 5 derniers emails, trie mes mails d'avril..."
        onkeydown="if(event.key==='Enter') send()" />
      <button id="send-btn" onclick="send()">Envoyer ➤</button>
    </div>
  </main>

</div>

<script>
  function log(text, type = "info") {
    const logs = document.getElementById("logs");
    const line = document.createElement("div");
    line.className = `log-line ${type}`;
    line.textContent = text;
    logs.appendChild(line);
    logs.scrollTop = logs.scrollHeight;
  }

  function clearLogs() {
    const logs = document.getElementById("logs");
    logs.innerHTML = `<div class="log-line muted">─────────────────────────────────</div>`;
  }

  function setLoading(loading) {
    const btn = document.getElementById("send-btn");
    const dot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const input = document.getElementById("msg-input");

    if (loading) {
      btn.disabled = true;
      btn.textContent = "...";
      dot.classList.add("loading");
      statusText.textContent = "En cours...";
      input.disabled = true;
    } else {
      btn.disabled = false;
      btn.textContent = "Envoyer ➤";
      dot.classList.remove("loading");
      statusText.textContent = "Connecté";
      input.disabled = false;
      input.focus();
    }
  }

  async function send(preset = null) {
    const input = document.getElementById("msg-input");
    const message = preset || input.value.trim();
    if (!message) return;

    input.value = "";
    log("─────────────────────────────────", "muted");
    log(`👤 Toi : ${message}`, "user");
    setLoading(true);

    // Spinner animé
    const logs = document.getElementById("logs");
    const thinking = document.createElement("div");
    thinking.className = "thinking";
    thinking.innerHTML = `<span class="spinner"></span> L'agent réfléchit...`;
    logs.appendChild(thinking);
    logs.scrollTop = logs.scrollHeight;

    try {
      const res = await fetch("http://127.0.0.1:5000/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });

      thinking.remove();
      const data = await res.json();

      if (data.error) {
        log(`❌ Erreur : ${data.error}`, "error");
      } else {
        for (const entry of data.logs) {
          log(entry.text, entry.type);
        }
      }
    } catch (err) {
      thinking.remove();
      log(`❌ Impossible de joindre le serveur : ${err.message}`, "error");
      log("💡 Vérifie que app.py tourne bien avec : python3 app.py", "warning");
    } finally {
      setLoading(false);
    }
  }
</script>

</body>
</html>
